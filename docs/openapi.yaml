openapi: 3.1.0
info:
  title: DoodlePaws API
  version: 2.0.0
  description: |
    Express BFF for pet catalog and adoption applications.
    Human summary and sync rules — see docs/apiSpec.md and docs/README.md.
    Requirement IDs — see docs/SRS.md.
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:4000
    description: Local backend
  - url: http://localhost:8080
    description: Docker nginx (proxied to backend)
  - url: /
    description: Relative (frontend dev/prod proxy)

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      tags: [Platform]
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      summary: Readiness check
      operationId: getHealthReady
      tags: [Platform]
      description: Returns ok only when Supabase is reachable.
      responses:
        '200':
          description: Service ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SchemaNotReady'

  /api/pets:
    get:
      summary: List all pets
      operationId: listPets
      tags: [Pets]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Optional page size (v1.1 — implemented). Omit to return full catalog.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, pending, adopted]
          description: Filter by pet status (v2)
        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: Filter pets containing this tag (v2)
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search name or tags substring (v2)
      responses:
        '200':
          description: Pet list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SchemaNotReady'

  /api/pets/{id}:
    get:
      summary: Get pet by id
      operationId: getPetById
      tags: [Pets]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
          example: buster
      responses:
        '200':
          description: Single pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SchemaNotReady'

  /api/adoption-applications:
    post:
      summary: Submit adoption application
      operationId: createAdoptionApplication
      tags: [Adoption]
      description: Rate limited to 10 requests per IP per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptionApplicationRequest'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Pet not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error: Pet not available for adoption
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error: Too many requests
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SchemaNotReady'

  /api/admin/login:
    post:
      summary: Admin login (API key)
      operationId: adminLogin
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Credentials valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Admin not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/admin/applications:
    get:
      summary: List adoption applications (admin)
      operationId: listAdminApplications
      tags: [Admin]
      security:
        - AdminKey: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
            default: pending
      responses:
        '200':
          description: Application list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdoptionApplication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/SchemaNotReady'

  /api/admin/applications/{id}/review:
    post:
      summary: Approve or reject application (admin)
      operationId: reviewAdoptionApplication
      tags: [Admin]
      security:
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewApplicationRequest'
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Application not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          $ref: '#/components/responses/SchemaNotReady'

components:
  schemas:
    HealthResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    Pet:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          example: buster
        name:
          type: string
        quote:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          format: uri
          nullable: true
        age:
          type: string
          nullable: true
        breed:
          type: string
          nullable: true
        likes:
          type: array
          items:
            type: string
          default: []
        tags:
          type: array
          items:
            type: string
          default: []
        status:
          type: string
          enum: [available, pending, adopted]
        refId:
          type: string
          nullable: true

    AdoptionApplicationRequest:
      type: object
      required: [petId, applicantName, favoriteSnack, promiseGiven]
      properties:
        petId:
          type: string
          pattern: '^[a-z0-9-]+$'
          example: buster
        applicantName:
          type: string
          maxLength: 200
        favoriteSnack:
          type: string
          maxLength: 200
        promiseGiven:
          type: boolean
          enum: [true]

    AdoptionApplicationResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    AdoptionApplication:
      type: object
      required: [id, petId, petName, applicantName, promiseGiven, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        petId:
          type: string
        petName:
          type: string
        applicantName:
          type: string
        favoriteSnack:
          type: string
          nullable: true
        promiseGiven:
          type: boolean
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
          format: date-time

    AdminLoginRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string

    ReviewApplicationRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]

    ReviewApplicationResponse:
      type: object
      required: [ok, action]
      properties:
        ok:
          type: boolean
          enum: [true]
        action:
          type: string
          enum: [approve, reject]

    ErrorBody:
      type: object
      properties:
        error:
          type: string
        hint:
          type: string
        code:
          type: string
        details:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: Invalid payload
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: Not found
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: Internal server error
    SchemaNotReady:
      description: Database schema not migrated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Missing or invalid admin credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: Unauthorized

  securitySchemes:
    AdminKey:
      type: apiKey
      in: header
      name: X-Admin-Key

security: []
